<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14120f">
  <meta name="description" content="Pulso Orbital: defensa arcade por oleadas infinitas. Apunta, elige mejoras y vence a los jefes. Sin conexión.">
  <title>Pulso Orbital · Beta 0.4.0</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="cabinet" id="app">
    <canvas id="arena" aria-label="Arena de Pulso Orbital: arrastra para apuntar y defender el núcleo"></canvas>
    <div class="danger-edge" aria-hidden="true"></div>

    <header class="hud" id="hud">
      <div class="hud__top">
        <div class="hud__score" id="scoreDisplay"></div>
        <div class="hud__wave"><small>Oleada</small><div id="waveDisplay"></div></div>
        <div class="hud__buttons">
          <button id="soundButton" class="key" type="button" aria-pressed="false" aria-label="Activar sonido"></button>
          <button id="pauseButton" class="key" type="button" aria-label="Pausar el juego"></button>
        </div>
      </div>
      <div class="hud__bottom">
        <div class="integrity" id="integrity"></div>
        <div class="combo" id="combo" hidden><b id="comboMult">×2</b><span class="combo__bar"><i id="comboBar"></i></span></div>
      </div>
      <div class="hud__formation" id="formation"></div>
    </header>

    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="coach" id="coach" aria-live="polite"></div>
    <section class="overlay" id="overlay" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
